name: hisab
description: Bangla-first business management for Bangladesh's small shops.
publish_to: 'none'
version: 0.1.0+1

environment:
  # Pinned to the toolchain actually installed, confirmed 03-09-2026:
  #   Flutter 3.47.2 · Dart 3.13.2 · DevTools 2.60.0
  # The lower bound is the installed Dart, not a guess — a looser floor would
  # let a contributor resolve packages against an older SDK than CI uses.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '3.47.2'

# ── Dependencies are DELIBERATELY UNPINNED HERE ──────────────────────────────
# Story 1.1 requires every version to be checked against the live registry.
# pub.dev is unreachable from the environment this file was generated in, so
# writing versions here would be a guess — exactly what this story exists to
# prevent. Run `scripts/bootstrap.sh` on a machine with Flutter installed: it
# calls `flutter pub add`, which resolves against pub.dev and writes exact
# versions into this file and into pubspec.lock. Commit both.
#
# Until that is done, Story 1.1 is NOT complete.

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  drift: ^2.34.4
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  riverpod_annotation: ^4.0.6
  share_plus: ^13.3.0
  sqlite3: ^3.5.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.8

# AD-17 / AR-17 — the local database is encrypted with SQLCipher.
# sqlite3 3.x bundles the binary through Dart's hooks system, which replaced
# the sqlcipher_flutter_libs / sqlite3_flutter_libs packages (both retired,
# published as `+eol`). Selecting the source here is what makes the shipped
# SQLite build the SQLCipher one.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  # UX-DR3 — Bangla conjuncts do not render reliably from system fonts, on
  # screen or in generated PDFs. Both faces ship as bundled assets.
  # Add the .ttf files under assets/fonts/ before enabling this block.
  # fonts:
  #   - family: NotoSerifBengali
  #     fonts:
  #       - asset: assets/fonts/NotoSerifBengali-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/NotoSerifBengali-Bold.ttf
  #         weight: 700
  #   - family: HindSiliguri
  #     fonts:
  #       - asset: assets/fonts/HindSiliguri-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/HindSiliguri-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/HindSiliguri-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/HindSiliguri-Bold.ttf
  #         weight: 700
