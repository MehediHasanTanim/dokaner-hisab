[project]
name = "hisab-ai"
version = "0.0.0"
description = "Hisab AI service — read-only. Classifies intent and fills parameters for a fixed query catalogue. It has no write path (AD-12)."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg==3.3.5",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.5"]

[tool.ruff]
line-length = 100
target-version = "py312"
