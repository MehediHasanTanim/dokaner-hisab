<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap">
  <style>
    :root{--paper:#FAF5EA;--paper2:#F1E7D3;--card:#FFFDF8;--ink:#2B2419;--mut:#7C6F5B;--rule:#E4D9C2;--acc:#1F5D46;--in:#1F5D46;--out:#9C4221;--warn:#8A6516}
    *{box-sizing:border-box}
    body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
    a{color:#1F5D46;text-decoration:none} a:hover{color:#14402F}
    .scr{width:390px;height:844px;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;position:relative}
    .ab{height:58px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--rule);background:var(--paper)}
    .ab .t{font-family:'Noto Serif Bengali',Georgia,serif;font-size:18px;font-weight:600;letter-spacing:-.01em}
    .ab .sp{flex-grow:1}
    .bd{flex-grow:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px}
    .bd.p0{padding:0}
    .bd.sc{overflow-y:auto}
    .card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:14px}
    .card.q{background:var(--paper2);border-color:transparent}
    .k{font-size:12px;color:var(--mut);font-weight:500;letter-spacing:.01em}
    .amt{font-weight:700;letter-spacing:-.02em;line-height:1.1}
    .xl{font-size:36px} .lg{font-size:26px} .md{font-size:19px} .sm{font-size:15px}
    .in{color:var(--in)} .out{color:var(--out)} .wn{color:var(--warn)} .mu{color:var(--mut)}
    .g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .fc{display:flex;flex-direction:column}
    .fr{display:flex;flex-direction:row;align-items:center}
    .qa{background:var(--card);border:1px solid var(--rule);border-radius:14px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer}
    .qa .ic{color:var(--acc)}
    .nav{height:66px;flex-shrink:0;display:flex;border-top:1px solid var(--rule);background:var(--card)}
    .ni{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mut);font-weight:500;cursor:pointer}
    .ni.on{color:var(--acc);font-weight:600}
    .row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--rule)}
    .av{width:38px;height:38px;border-radius:19px;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:var(--acc);flex-shrink:0}
    .nm{font-size:15px;font-weight:600;line-height:1.3}
    .sb{font-size:12.5px;color:var(--mut);line-height:1.4}
    .btn{width:100%;height:54px;border-radius:13px;background:var(--acc);color:#FFFDF8;font-family:inherit;font-size:16.5px;font-weight:600;border:none;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
    .btn.s{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
    .btn.g{background:var(--paper2);color:var(--ink);border:none}
    .chip{display:inline-flex;align-items:center;gap:5px;background:var(--paper2);font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;color:var(--ink)}
    .chip.w{background:#F6EAD2;color:var(--warn)}
    .fld{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
    .fld .v{font-size:17px;font-weight:600}
    .fld .v.ph{color:#B9AC94;font-weight:500}
    .led{border-top:1px solid var(--rule)}
    .lr{display:grid;grid-template-columns:52px 1fr 78px 82px;gap:6px;padding:11px 16px;border-bottom:1px solid var(--rule);font-size:13px;align-items:center}
    .lr.h{background:var(--paper2);font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.03em;text-transform:uppercase;border-bottom:1px solid var(--rule)}
    .ta-r{text-align:right}
    .hd{font-family:'Noto Serif Bengali',Georgia,serif;font-weight:600}
    .ban{background:#F6EAD2;border:1px solid #E3CFA4;border-radius:12px;padding:10px 12px;font-size:13px;color:#6B4E10;display:flex;gap:9px;align-items:flex-start;line-height:1.45}
    .ai{background:#EBF1EC;border:1px solid #C9DCCE;border-radius:14px;padding:14px}
    .dot{width:7px;height:7px;border-radius:4px;background:var(--out);flex-shrink:0}
    .sep{height:1px;background:var(--rule);border:none;margin:2px 0}
    .tt{font-size:13.5px;line-height:1.55;color:var(--mut)}
  </style>
</helmet>
<div class="scr">
  <div class="ab"><div style="color:var(--ink)"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div><div class="sp"></div><div class="k">২ / ৪</div></div>
  <div style="height:3px;background:var(--paper2)"><div style="width:50%;height:3px;background:var(--acc)"></div></div>
  <div class="bd sc" style="padding:22px;gap:16px">
    <div class="hd" style="font-size:24px">ব্যবসার নাম কী?</div>
    <div class="fld"><div class="k">নাম</div><div class="v">রহমান গ্রোসারি</div></div>
    <div class="k" style="margin-top:6px">কী ধরনের ব্যবসা?</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <div class="chip" style="padding:9px 14px;background:var(--acc);color:#FFFDF8">মুদি</div>
      <div class="chip" style="padding:9px 14px">কাপড়</div>
      <div class="chip" style="padding:9px 14px">ইলেকট্রনিক্স</div>
      <div class="chip" style="padding:9px 14px">রেস্টুরেন্ট</div>
      <div class="chip" style="padding:9px 14px">ফার্মেসি</div>
      <div class="chip" style="padding:9px 14px">হার্ডওয়্যার</div>
      <div class="chip" style="padding:9px 14px">কসমেটিকস</div>
      <div class="chip" style="padding:9px 14px">মোবাইল</div>
      <div class="chip" style="padding:9px 14px">অনলাইন</div>
      <div class="chip" style="padding:9px 14px">অন্যান্য</div>
    </div>
    <div class="fld" style="margin-top:6px"><div class="k">ঠিকানা <span class="mu">— ইচ্ছা হলে</span></div><div class="v ph">মিরপুর ১০, ঢাকা</div></div>
  </div>
  <div style="padding:14px 16px;border-top:1px solid var(--rule)"><button class="btn">পরবর্তী</button></div>
</div>
</x-dc>
</body>
</html>
