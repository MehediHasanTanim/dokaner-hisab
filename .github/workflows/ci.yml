name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: api · admin · contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  python:
    name: ai
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  flutter:
    name: mobile
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/mobile/pubspec.lock') != '' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'   # bundles Dart 3.13.2 — keep in step with apps/mobile/pubspec.yaml
          channel: stable

      # UX-DR3 — the Bangla faces are bundled assets, fetched once by
      # scripts/fetch-fonts.sh and committed. CI never downloads a font. If the
      # files are not here the build stops now, loudly, rather than producing an
      # app that silently substitutes a system face and shows tofu boxes.
      - name: Bundled Bangla fonts are present
        run: |
          missing=0
          for f in \
            NotoSerifBengali-SemiBold.ttf \
            NotoSerifBengali-Bold.ttf \
            HindSiliguri-Regular.ttf \
            HindSiliguri-Medium.ttf \
            HindSiliguri-SemiBold.ttf \
            HindSiliguri-Bold.ttf
          do
            if [ ! -s "assets/fonts/$f" ]; then
              echo "::error::assets/fonts/$f is missing or empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Run 'cd apps/mobile && ./scripts/fetch-fonts.sh' on a machine"
            echo "with a network connection and commit the .ttf files, the two"
            echo "OFL licences and MANIFEST.txt."
            exit 1
          fi
          echo "All six faces present:"
          ls -l assets/fonts

      - run: flutter pub get

      # UX-DR1 — the theme is the only source of colour, type, radius and
      # spacing. A literal in a widget is blocked here, not in review.
      - name: No style literals outside lib/theme/
        run: dart run tool/check_theme_tokens.dart

      - run: flutter analyze
      - run: flutter test
