name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: api · admin · contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  python:
    name: ai
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  flutter:
    name: mobile
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/mobile/pubspec.lock') != '' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'   # bundles Dart 3.13.2 — keep in step with apps/mobile/pubspec.yaml
          channel: stable

      # UX-DR3 — the Bangla faces are bundled assets, fetched once by
      # scripts/fetch-fonts.sh and committed. CI never downloads a font. If the
      # files are not here the build stops now, loudly, rather than producing an
      # app that silently substitutes a system face and shows tofu boxes.
      - name: Bundled Bangla fonts are present
        run: |
          missing=0
          for f in \
            NotoSerifBengali-SemiBold.ttf \
            NotoSerifBengali-Bold.ttf \
            HindSiliguri-Regular.ttf \
            HindSiliguri-Medium.ttf \
            HindSiliguri-SemiBold.ttf \
            HindSiliguri-Bold.ttf
          do
            if [ ! -s "assets/fonts/$f" ]; then
              echo "::error::assets/fonts/$f is missing or empty"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Run 'cd apps/mobile && ./scripts/fetch-fonts.sh' on a machine"
            echo "with a network connection and commit the .ttf files, the two"
            echo "OFL licences and MANIFEST.txt."
            exit 1
          fi
          echo "All six faces present:"
          ls -l assets/fonts

      - run: flutter pub get

      # UX-DR1 — the theme is the only source of colour, type, radius and
      # spacing. A literal in a widget is blocked here, not in review.
      - name: No style literals outside lib/theme/
        run: dart run tool/check_theme_tokens.dart

      # UX-DR4 — one formatter and one parser for the whole product. Screens,
      # receipts, reports, CSV export, notifications and the AI draft parser all
      # render the identical stored integer through lib/format/. A second
      # implementation is how a receipt comes to disagree with a screen, and it
      # is blocked here, not in review.
      - name: No second number formatter outside lib/format/
        run: dart run tool/check_single_formatter.dart

      # AD-17 / AR-17 — Drift generates the schema, the companions and the row
      # classes into `.g.dart` files that are NOT committed. Nothing under
      # lib/data/ compiles until this runs, so it runs before analyze rather
      # than after it, and a generator failure stops the build here with the
      # generator's own message instead of a hundred "undefined class" errors.
      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # AD-1, AD-2, AD-3, AD-4, AD-9, AD-10, AD-11, AD-19 — the storage
      # conventions Story 1.4 established and every later table inherits: money
      # named `…Paisa`, quantity named `…Milli`, one client-minted UUIDv7 per
      # record, no serverId, no stored balance, every table classified financial
      # or reference, and Drift importable only from lib/data/. A deviation here
      # is inherited by every table that comes after it, so it is blocked at the
      # merge rather than found three epics later in a figure that disagrees
      # with itself.
      - name: Storage conventions hold
        run: dart run tool/check_data_access.dart

      - run: flutter analyze
      - run: flutter test
